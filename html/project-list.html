<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="h-full bg-[#181818] text-white">
<div class="flex max-h-screen ">
    <div id="sidebar-container" class="flex-shrink-0"></div>

    <main class="flex-1 pt-8 pb-12 outline outline-2 outline-gray-400 rounded-2xl m-6 bg-[#121212]">
        <section class="w-full px-6 md:px-8 space-y-8 mt-2 ">
            <div class="flex flex-col gap-2 md:flex-row md:items-center md:justify-between">
                <div>
                    <p class="text-sm uppercase tracking-wide text-gray-400">Overview</p>
                    <h1 class="text-6xl font-bold text-white">Projects</h1>
                </div>
                <div class="flex gap-3">
                    <button id="refresh-projects"
                            class="px-4 py-2 rounded-lg bg-gray-800 text-gray-200 hover:bg-gray-700 transition">
                        Refresh
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-gray-900 rounded-2xl p-5 border border-gray-800">
                    <p class="text-sm text-gray-400">Total projects</p>
                    <p id="projects-total" class="text-3xl font-semibold text-white mt-2">-</p>
                </div>
                <div class="bg-gray-900 rounded-2xl p-5 border border-gray-800">
                    <p class="text-sm text-gray-400">Confirmed</p>
                    <p id="projects-confirmed" class="text-3xl font-semibold text-white mt-2">-</p>
                </div>
                <div class="bg-gray-900 rounded-2xl p-5 border border-gray-800">
                    <p class="text-sm text-gray-400">Requested</p>
                    <p id="projects-requested" class="text-3xl font-semibold text-white mt-2">-</p>
                </div>
            </div>
        <!-- Alt content venstrejusteret, fylder hele main -->
        <section class="mb-16">

            <!-- Projects "card" -->
            <div class="bg-gray-900 rounded-t-2xl shadow-lg p-6">
                <!-- Search Bar + Create Button -->
                <div class="flex items-center justify-between mb-6">

                    <!-- Left: Search -->
                    <div class="flex">
                        <input id="search-input" type="text" placeholder="Search projects..."
                               class="px-4 py-2 rounded-l-lg bg-gray-700 text-white
                          focus:outline-none focus:ring-2 focus:ring-blue-400 w-64">
                        <button id="search-btn"
                                class="px-4 py-2 bg-[#55A5F8] text-white
                           hover:bg-[#3F8CE0] transition-all rounded-tr-lg rounded-br-lg">
                            Search
                        </button>
                    </div>


                </div>
            </div>

            <!-- Tabel -->
            <div class="overflow-x-auto">
                <table class="w-full bg-gray-800 rounded-b-lg table-auto">
                    <thead>
                    <tr class="text-left text-gray-300 border-b border-gray-700">
                        <th class="p-7">ID</th>
                        <th class="p-7">Name</th>
                        <th class="p-7">Customer</th>
                        <th class="p-7">Contact Person</th>
                        <th class="p-7">Status</th>
                        <th class="p-7">Rental Start</th>
                        <th class="p-7">Rental End</th>
                    </tr>
                    </thead>
                    <tbody id="projects-table-body"></tbody>
                </table>
            </div>
        </section>
    </main>

        </div>
    </div>
</div>

<!-- Ikke module (medmindre main.js selv bruger import/export) -->
<script src="../js/main.js"></script>

<!-- Projects page script -->
<script src="../js/pages/projects.js"></script>

<!-- Inline module til navigation -->
<script type="module">
    import { loadNavbar } from '../js/navigation/navbar.js';
    import { loadSidebar } from '../js/navigation/sidebar.js';

    document.addEventListener("DOMContentLoaded", () => {
        loadNavbar('navbar-container');
        loadSidebar('sidebar-container');
    });
</script>

</body>
</html>

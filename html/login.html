<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoVault - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="h-full bg-gray-900 text-white">

<div class="flex h-screen">
    <div class="w-1/2 relative bg-[#121212] overflow-hidden">
        <div id="slider"
             class="flex w-[200%] h-full transform transition-transform duration-500 ease-in-out">
            <div id="loginContainer" class="w-1/2 flex items-center justify-center h-full"></div>
            <div id="registerContainer" class="w-1/2 flex items-center justify-center h-full"></div>
        </div>
    </div>

    <div class="w-1/2 bg-cover bg-center relative"
         style="background-image: url('../imgs/login/pexels-wendywei-1190297.jpg');">
        <div class="absolute inset-0 bg-black bg-opacity-40"></div>
    </div>
</div>

<script type="module">
    import { loadLoginContainer } from '../js/login/login.js';
    import { loadRegistrationContainer } from '../js/login/registration.js';


    const slider = document.getElementById('slider');

    export function showRegister() {
        slider.style.transform = 'translateX(-50%)';
    }

    export function showLogin() {
        slider.style.transform = 'translateX(0%)';
    }

    window.showRegister = showRegister;
    window.showLogin = showLogin;

    loadLoginContainer('loginContainer');
    loadRegistrationContainer('registerContainer');
</script>
</body>
</html>

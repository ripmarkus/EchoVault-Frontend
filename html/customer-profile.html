<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoVault – Customer Profile</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: "class" };
    </script>
</head>

<body class="h-full bg-[#121212] text-white">

<!-- Navbar -->
<div id="navbar-container"></div>

<div class="flex max-h-screen bg-[#121212]">
    <!-- Sidebar -->
    <div id="sidebar-container" class="flex-shrink-0"></div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 pt-2 pb-20">
        <section class="px-8 w-full">

            <!-- PAGE TITLE -->
            <div class="flex items-center justify-between mb-10">
                <h1 id="customer-name-title" class="text-4xl font-bold"></h1>
            </div>

            <!-- ========================================================= -->
            <!--  TOP GRID: DETAILS + CONTACTS                            -->
            <!-- ========================================================= -->
            <div class="grid grid-cols-1 xl:grid-cols-3 gap-3 mb-3">

                <!-- DETAILS (left 2/3) -->
                <div class="col-span-2 bg-gray-900 rounded-2xl border border-gray-700 p-6">
                    <h2 class="text-2xl font-semibold mb-4">Details</h2>

                    <div class="grid grid-cols-2 gap-y-6 text-gray-300">

                        <!-- NAME -->
                        <div class="flex items-start justify-between group">
                            <div>
                                <p class="text-sm text-blue-300 underline">Name</p>
                                <p id="detail-name" class="text-lg font-medium"></p>
                            </div>
                            <button class="opacity-0 group-hover:opacity-100 transition text-gray-400 hover:text-white"
                                    data-edit-field="name">✏️</button>
                        </div>

                        <!-- ADDRESS -->
                        <div class="flex items-start justify-between group">
                            <div>
                                <p class="text-sm text-blue-300 underline">Address</p>
                                <p id="detail-address"></p>
                            </div>
                            <button class="opacity-0 group-hover:opacity-100 transition text-gray-400 hover:text-white"
                                    data-edit-field="addressLine">✏️</button>
                        </div>

                        <!-- CVR -->
                        <div class="flex items-start justify-between group">
                            <div>
                                <p class="text-sm text-blue-300 underline">CVR</p>
                                <p id="detail-cvr"></p>
                            </div>
                            <button class="opacity-0 group-hover:opacity-100 transition text-gray-400 hover:text-white"
                                    data-edit-field="cvr">✏️</button>
                        </div>

                        <!-- PHONE -->
                        <div class="flex items-start justify-between group">
                            <div>
                                <p class="text-sm text-blue-300 underline">Phone</p>
                                <p id="detail-phone"></p>
                            </div>
                            <button class="opacity-0 group-hover:opacity-100 transition text-gray-400 hover:text-white"
                                    data-edit-field="phone">✏️</button>
                        </div>

                        <!-- ZIP -->
                        <div class="flex items-start justify-between group">
                            <div>
                                <p class="text-sm text-blue-300 underline">Zip code</p>
                                <p id="detail-postalCode"></p>
                            </div>
                            <button class="opacity-0 group-hover:opacity-100 transition text-gray-400 hover:text-white"
                                    data-edit-field="postalCode">✏️</button>
                        </div>

                        <!-- EMAIL -->
                        <div class="flex items-start justify-between group">
                            <div>
                                <p class="text-sm text-blue-300 underline">Email</p>
                                <p id="detail-email"></p>
                            </div>
                            <button class="opacity-0 group-hover:opacity-100 transition text-gray-400 hover:text-white"
                                    data-edit-field="email">✏️</button>
                        </div>

                    </div>
                </div>

                <!-- CONTACTS (right 1/3) -->
                <div class="bg-gray-900 rounded-2xl border border-gray-700 p-6">
                    <div class="flex justify-between mb-4">
                        <h2 class="text-xl font-semibold">Contacts</h2>
                        <button id="open-contact-modal-btn" class="text-blue-300 underline">+ Add</button>
                    </div>
                    <div id="contacts-list" class="space-y-3 text-gray-300"></div>
                </div>

            </div>

            <!-- ========================================================= -->
            <!--  SECOND GRID: INVOICES (left 2/3) + ARTISTS (right 1/3)  -->
            <!-- ========================================================= -->
            <div class="grid grid-cols-1 xl:grid-cols-3 gap-3 mb-3">

                <!-- INVOICES (left 2/3, below Details) -->
                <div class="col-span-2 bg-gray-900 rounded-2xl border border-gray-700 p-6">
                    <h2 class="text-xl font-semibold mb-4">Invoices</h2>

                    <div id="invoice-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- JS inserts invoices -->
                    </div>

                    <button class="mt-3 text-blue-300 underline">See all</button>
                </div>

                <!-- ASSOCIATED ARTISTS (right, under Contacts) -->
                <div id="artists-section"
                     class="bg-gray-900 rounded-2xl border border-gray-700 p-6">
                    <div class="flex justify-between mb-3">
                        <h3 class="text-xl font-semibold">Associated Artists</h3>
                        <button class="text-blue-300 underline">+ Add</button>
                    </div>

                    <div id="artists-list" class="space-y-3"></div>

                    <button class="text-blue-300 underline mt-4">See all</button>
                </div>

            </div>

            <!-- ========================================================= -->
            <!--  PERFORMANCE DATA (full width)                           -->
            <!-- ========================================================= -->
            <div class="bg-gray-900 rounded-2xl border border-gray-700 p-6 mb-3">
                <h2 class="text-2xl font-semibold mb-6">Performance Data</h2>

                <div class="grid grid-cols-1 xl:grid-cols-3 gap-3">

                    <!-- PIE CHART -->
                    <div class="bg-gray-800 rounded-xl p-4">
                        <h3 class="text-blue-300 underline mb-2">Most Profitable Artists</h3>
                        <canvas id="artist-pie-chart" class="w-full h-60"></canvas>
                    </div>

                    <!-- METRICS -->
                    <div class="bg-gray-800 rounded-xl p-4 space-y-4">
                        <h3 class="text-blue-300 underline">Orders fulfilled</h3>
                        <p id="metric-orders" class="text-xl font-semibold">–</p>
                        <h3 class="text-blue-300 underline">Average turnaround time</h3>
                        <p id="metric-turnaround" class="text-xl font-semibold">–</p>
                        <h3 class="text-blue-300 underline">Revenue % of Year</h3>
                        <p id="metric-revenue" class="text-xl font-semibold">–%</p>
                    </div>

                    <!-- EMPTY OR FUTURE MODULE -->
                    <div class="bg-gray-800 rounded-xl p-4">
                        <h3 class="text-blue-300 underline mb-2">Revenue Trend</h3>
                        <canvas id="revenue-line-chart" class="w-full h-60"></canvas>
                    </div>

                </div>
            </div>

        </section>
    </main>
</div>

<!-- Navigation -->
<script type="module">
    import { loadNavbar } from "../js/navigation/navbar.js";
    import { loadSidebar } from "../js/navigation/sidebar.js";

    document.addEventListener("DOMContentLoaded", () => {
        loadNavbar("navbar-container");
        loadSidebar("sidebar-container");
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="../js/pages/customer-profile.js" type="module"></script>

<!-- CONTACT SELECTION MODAL -->
<div id="contact-modal"
     class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60">
    <div class="bg-gray-900 rounded-2xl shadow-xl w-full max-w-xl p-6">

        <!-- TITLE + CLOSE -->
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-xl font-semibold">Manage Contacts</h3>
            <button id="contact-modal-close"
                    class="w-8 h-8 flex items-center justify-center rounded bg-gray-800 hover:bg-gray-700 text-gray-300">✕</button>
        </div>

        <!-- FILTERS -->
        <div class="flex items-center justify-between mb-3">

            <!-- Tabs -->
            <div class="flex gap-2">
                <button id="contact-tab-all"
                        class="px-3 py-1 rounded bg-blue-600 text-white text-sm font-semibold">
                    All
                </button>

                <button id="contact-tab-linked"
                        class="px-3 py-1 rounded bg-gray-700 text-gray-300 text-sm hover:bg-gray-600">
                    Linked
                </button>
            </div>

            <!-- Search -->
            <input id="contact-search" type="text"
                   placeholder="Search contacts..."
                   class="px-3 py-1 rounded bg-gray-800 border border-gray-700 text-white text-sm w-40" />
        </div>

        <!-- CONTACT LIST -->
        <div id="contact-list" class="space-y-3 max-h-80 overflow-y-auto border border-gray-800 p-3 rounded">
        </div>

        <!-- CREATE NEW CONTACT -->
        <div class="mt-4 border-t border-gray-700 pt-4">
            <h4 class="text-gray-300 font-semibold mb-2">Add New Contact</h4>

            <div class="grid grid-cols-3 gap-2 mb-3">
                <input id="new-contact-name" type="text"
                       placeholder="Name"
                       class="px-2 py-1 rounded bg-gray-800 border border-gray-700 text-white text-sm"/>

                <input id="new-contact-email" type="email"
                       placeholder="Email"
                       class="px-2 py-1 rounded bg-gray-800 border border-gray-700 text-white text-sm"/>

                <input id="new-contact-phone" type="text"
                       placeholder="Phone"
                       class="px-2 py-1 rounded bg-gray-800 border border-gray-700 text-white text-sm"/>
            </div>

            <button id="create-contact-btn"
                    class="px-3 py-1 bg-green-600 hover:bg-green-500 rounded text-white text-sm font-semibold">
                + Create Contact
            </button>
        </div>

        <!-- SAVE -->
        <div class="flex justify-end mt-4">
            <button id="contact-save-btn"
                    class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded text-white font-semibold">
                Save
            </button>
        </div>
    </div>
</div>

</body>
</html>

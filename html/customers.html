<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoVault - Customers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="h-full bg-[#121212] text-white">

<div id="navbar-container"></div>

<div class="flex max-h-screen bg-[#121212]">
    <div id="sidebar-container" class="flex-shrink-0"></div>

    <main class="flex-1 pt-8 pb-12">
        <!-- Alt content venstrejusteret, fylder hele main -->
        <section class="w-full pl-8 pr-8 mb-16">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-3xl font-bold text-white">Customers</h2>


            </div>

            <!-- Customers "card" -->
            <div class="bg-gray-900 rounded-t-2xl shadow-lg p-6">
                <!-- Search Bar + Create Button -->
                <div class="flex items-center justify-between mb-6">

                    <!-- Left: Search -->
                    <div class="flex">
                        <input id="search-input" type="text" placeholder="Search customers..."
                               class="px-4 py-2 rounded-l-lg bg-gray-700 text-white
                          focus:outline-none focus:ring-2 focus:ring-blue-400 w-64">
                        <button id="search-btn"
                                class="px-4 py-2 rounded-r-lg bg-[#55A5F8] text-white
                           hover:bg-[#3F8CE0] transition-all">
                            Search
                        </button>
                    </div>

                    <!-- Right: Create Button -->
                    <button id="create-customer-btn"
                            class="px-4 py-2 rounded-lg bg-[#55A5F8] text-white font-semibold
                       hover:bg-[#3F8CE0] transition">
                        + New customer
                    </button>

                </div>
            </div>

                <!-- Tabel -->
                <div class="overflow-x-auto">
                    <table class="w-full bg-gray-800 rounded-b-lg table-auto">
                        <thead>
                        <tr class="text-left text-gray-300 border-b border-gray-700">
                            <th class="p-7">Select</th>
                            <th class="p-7">ID</th>
                            <th class="p-7">Name</th>
                            <th class="p-7">CVR</th>
                            <th class="p-7">Address</th>
                            <th class="p-7">Actions</th>
                        </tr>
                        </thead>
                        <tbody id="customers-table-body">
                        <!-- Data via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- View modal -->
    <div id="customer-modal"
         class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60">
        <div class="bg-gray-900 rounded-2xl shadow-xl w-full max-w-xl p-6">
            <div class="flex items-center justify-between mb-4">
                <h3 id="customer-modal-title" class="text-xl font-semibold text-white">
                    Customer details
                </h3>
                <button id="customer-modal-close"
                        class="w-8 h-8 flex items-center justify-center rounded bg-gray-800 hover:bg-gray-700 text-gray-300">
                    ✕
                </button>
            </div>
            <div id="customer-modal-content" class="space-y-2 text-sm text-gray-200">
                <!-- udfyldes via JS -->
            </div>
        </div>
    </div>

    <!-- Create/Update modal (form) -->
    <div id="customer-form-modal"
         class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60">
        <div class="bg-gray-900 rounded-2xl shadow-xl w-full max-w-xl p-6">
            <div class="flex items-center justify-between mb-4">
                <h3 id="customer-form-title" class="text-xl font-semibold text-white">
                    New customer
                </h3>
                <button id="customer-form-close"
                        class="w-8 h-8 flex items-center justify-center rounded bg-gray-800 hover:bg-gray-700 text-gray-300">
                    ✕
                </button>
            </div>

            <form id="customer-form" class="space-y-4">
                <input type="hidden" id="customer-form-mode" value="create"/>
                <input type="hidden" id="customer-form-id" value=""/>

                <div class="grid grid-cols-1 gap-4">
                    <div>
                        <label class="block text-sm text-gray-300 mb-1">Name</label>
                        <input id="form-name" type="text"
                               class="w-full px-3 py-2 rounded bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                               required>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-300 mb-1">CVR</label>
                        <input id="form-cvr" type="text"
                               class="w-full px-3 py-2 rounded bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-300 mb-1">Phone</label>
                        <input id="form-phone" type="text"
                               class="w-full px-3 py-2 rounded bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-300 mb-1">Email</label>
                        <input id="form-email" type="email"
                               class="w-full px-3 py-2 rounded bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-300 mb-1">Address line</label>
                        <input id="form-addressLine" type="text"
                               class="w-full px-3 py-2 rounded bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">Postal code</label>
                            <input id="form-postalCode" type="text"
                                   class="w-full px-3 py-2 rounded bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-300 mb-1">City</label>
                            <input id="form-city" type="text"
                                   class="w-full px-3 py-2 rounded bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-4">
                    <button type="button" id="customer-form-cancel"
                            class="px-4 py-2 rounded bg-gray-700 text-gray-200 hover:bg-gray-600">
                        Cancel
                    </button>
                    <button type="submit"
                            class="px-4 py-2 rounded bg-[#55A5F8] text-white font-semibold hover:bg-[#3F8CE0]">
                        Save
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Ikke module (medmindre main.js selv bruger import/export) -->
<script src="../js/main.js"></script>

<!-- Module-fil til customers-side -->
<script src="../js/pages/customers.js" type="module"></script>

<!-- Inline module til navigation -->
<script type="module">
    import { loadNavbar } from '../js/navigation/navbar.js';
    import { loadSidebar } from '../js/navigation/sidebar.js';

    document.addEventListener("DOMContentLoaded", () => {
        loadNavbar('navbar-container');
        loadSidebar('sidebar-container');
    });
</script>

</body>
</html>

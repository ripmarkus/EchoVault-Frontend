<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoVault - Projects</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="h-full bg-[#121212] text-white">

<div id="navbar-container"></div>

<div class="flex max-h-screen bg-[#121212]">
    <div id="sidebar-container" class="flex-shrink-0"></div>

    <main class="flex-1 pt-8 pb-12">
        <section class="w-full px-6 md:px-8 space-y-8">
            <div class="flex flex-col gap-2 md:flex-row md:items-center md:justify-between">
                <div>
                    <p class="text-sm uppercase tracking-wide text-gray-400">Overview</p>
                    <h1 class="text-3xl font-bold text-white">Projects</h1>
                </div>
                <div class="flex gap-3">
                    <button id="create-project-btn"
                            class="px-4 py-2 rounded-lg bg-[#55A5F8] text-white font-semibold hover:bg-[#3F8CE0] transition">
                        + New project
                    </button>
                    <button id="refresh-projects"
                            class="px-4 py-2 rounded-lg bg-gray-800 text-gray-200 hover:bg-gray-700 transition">
                        Refresh
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-gray-900 rounded-2xl p-5 border border-gray-800">
                    <p class="text-sm text-gray-400">Total projects</p>
                    <p id="projects-total" class="text-3xl font-semibold text-white mt-2">-</p>
                </div>
                <div class="bg-gray-900 rounded-2xl p-5 border border-gray-800">
                    <p class="text-sm text-gray-400">Confirmed</p>
                    <p id="projects-confirmed" class="text-3xl font-semibold text-white mt-2">-</p>
                </div>
                <div class="bg-gray-900 rounded-2xl p-5 border border-gray-800">
                    <p class="text-sm text-gray-400">Requested</p>
                    <p id="projects-requested" class="text-3xl font-semibold text-white mt-2">-</p>
                </div>
            </div>

            <div class="bg-gray-900 rounded-2xl shadow-lg border border-gray-800">
                <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 p-6">
                    <div class="flex w-full md:w-auto">
                        <input id="search-input" type="text" placeholder="Search projects or customers..."
                               class="px-4 py-2 rounded-l-lg bg-gray-800 text-white
                          focus:outline-none focus:ring-2 focus:ring-blue-400 w-full md:w-80">
                        <button id="search-btn"
                                class="px-4 py-2 rounded-r-lg bg-[#55A5F8] text-white
                           hover:bg-[#3F8CE0] transition-all">
                            Search
                        </button>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full bg-gray-800 rounded-b-2xl table-auto">
                        <thead>
                        <tr class="text-left text-gray-300 border-b border-gray-700">
                            <th class="p-6">Project</th>
                            <th class="p-6">Customer</th>
                            <th class="p-6">Status</th>
                            <th class="p-6">Period</th>
                            <th class="p-6">Shortages</th>
                            <th class="p-6">Actions</th>
                        </tr>
                        </thead>
                        <tbody id="projects-table-body">
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
</div>

<div id="project-modal"
     class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60">
    <div class="bg-gray-900 rounded-2xl shadow-xl w-full max-w-xl p-6">
        <div class="flex items-center justify-between mb-4">
            <h3 id="project-modal-title" class="text-xl font-semibold text-white">
                Project details
            </h3>
            <button id="project-modal-close"
                    class="w-8 h-8 flex items-center justify-center rounded bg-gray-800 hover:bg-gray-700 text-gray-300">
                ×
            </button>
        </div>
        <div id="project-modal-content" class="space-y-2 text-sm text-gray-200"></div>
    </div>
</div>

<div id="project-form-modal"
     class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60">
    <div class="bg-gray-900 rounded-2xl shadow-xl w-full max-w-2xl p-6">
        <div class="flex items-center justify-between mb-4">
            <h3 id="project-form-title" class="text-xl font-semibold text-white">
                New project
            </h3>
            <button id="project-form-close"
                    class="w-8 h-8 flex items-center justify-center rounded bg-gray-800 hover:bg-gray-700 text-gray-300">
                ×
            </button>
        </div>

        <form id="project-form" class="space-y-4">
            <input type="hidden" id="project-form-mode" value="create"/>
            <input type="hidden" id="project-form-id" value=""/>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-gray-300 mb-1">Name</label>
                    <input id="form-name" type="text" required
                           class="w-full px-3 py-2 rounded bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-300 mb-1">Status</label>
                    <select id="form-status"
                            class="w-full px-3 py-2 rounded bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="REQUESTED">Requested</option>
                        <option value="CONFIRMED">Confirmed</option>
                        <option value="CANCELLED">Cancelled</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-gray-300 mb-1">Customer</label>
                    <select id="form-customerId"
                            class="w-full px-3 py-2 rounded bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-gray-300 mb-1">Shortages</label>
                    <input id="form-shortages" type="number" min="0"
                           class="w-full px-3 py-2 rounded bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                           value="0">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-gray-300 mb-1">Start date</label>
                    <input id="form-startDate" type="date"
                           class="w-full px-3 py-2 rounded bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-300 mb-1">End date</label>
                    <input id="form-endDate" type="date"
                           class="w-full px-3 py-2 rounded bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div class="flex justify-end gap-3 pt-4">
                <button type="button" id="project-form-cancel"
                        class="px-4 py-2 rounded bg-gray-700 text-gray-200 hover:bg-gray-600">
                    Cancel
                </button>
                <button type="submit"
                        class="px-4 py-2 rounded bg-[#55A5F8] text-white font-semibold hover:bg-[#3F8CE0]">
                    Save
                </button>
            </div>
        </form>
    </div>
</div>

<script type="module" src="../js/pages/projects.js"></script>
<script type="module">
    import { loadNavbar } from '../js/navigation/navbar.js';
    import { loadSidebar } from '../js/navigation/sidebar.js';

    document.addEventListener("DOMContentLoaded", () => {
        loadNavbar('navbar-container');
        loadSidebar('sidebar-container');
    });
</script>
</body>
</html>

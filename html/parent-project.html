<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoVault - Parent Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
</head>
<body class="h-full bg-[#121212] text-white">

<div id="navbar-container"></div>

<div class="flex max-h-screen bg-[#121212]">
    <div id="sidebar-container" class="flex-shrink-0"></div>

    <main class="flex-1 pt-6 pb-12">
        <section class="w-full px-6 md:px-8 space-y-6">

            <div class="flex flex-col gap-2 md:flex-row md:items-center md:justify-between">
                <div>
                    <p class="text-sm uppercase tracking-wide text-gray-400">Parent project</p>
                    <h1 id="parent-title" class="text-3xl font-bold text-white">Loading...</h1>
                </div>
                <div class="flex gap-3">
                    <div class="px-4 py-2 rounded-lg bg-gray-800 text-gray-200">
                        <span class="text-sm text-gray-400">Customer</span>
                        <p id="parent-customer" class="text-white font-semibold">-</p>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-gray-900 rounded-2xl p-5 border border-gray-800">
                    <p class="text-sm text-gray-400">Start date</p>
                    <p id="parent-start" class="text-2xl font-semibold text-white mt-2">-</p>
                </div>
                <div class="bg-gray-900 rounded-2xl p-5 border border-gray-800">
                    <p class="text-sm text-gray-400">End date</p>
                    <p id="parent-end" class="text-2xl font-semibold text-white mt-2">-</p>
                </div>
                <div class="bg-gray-900 rounded-2xl p-5 border border-gray-800">
                    <p class="text-sm text-gray-400">Sub projects</p>
                    <p id="sub-count" class="text-2xl font-semibold text-white mt-2">-</p>
                </div>
            </div>

            <div class="bg-gray-900 rounded-2xl shadow-lg border border-gray-800">
                <div class="flex items-center justify-between gap-4 p-6">
                    <div>
                        <h2 class="text-2xl font-semibold text-white">Sub projects</h2>
                        <p class="text-sm text-gray-400">All sub projects under this parent</p>
                    </div>
                </div>

                <div class="p-6">
                    <div id="subprojects-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                    <div id="subprojects-empty" class="text-sm text-gray-400 hidden">No sub projects yet.</div>
                </div>
            </div>
        </section>
    </main>
</div>

<script type="module" src="../js/pages/parent-project.js"></script>
<script type="module">
    import { loadNavbar } from '../js/navigation/navbar.js';
    import { loadSidebar } from '../js/navigation/sidebar.js';

    document.addEventListener("DOMContentLoaded", () => {
        loadNavbar('navbar-container');
        loadSidebar('sidebar-container');
    });
</script>
</body>
</html>
